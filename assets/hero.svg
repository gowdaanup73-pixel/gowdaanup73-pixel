<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Anup Gowda K T, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#18213d" stroke-width="1"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="60" y="232" height="26" width="0">
        <animate attributeName="width" values="0;372;372;0" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- drifting grid -->
  <rect x="-30" y="-30" width="960" height="380" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;30 30" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ambient glow behind orbit -->
  <circle cx="730" cy="160" r="110" fill="#a855f7" opacity="0.18" filter="url(#blur)"/>
  <circle cx="730" cy="160" r="70" fill="#00f0ff" opacity="0.14" filter="url(#blur)"/>

  <!-- orbital system -->
  <g>
    <circle cx="730" cy="160" r="52" fill="none" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 7"/>
    <circle cx="730" cy="160" r="88" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="14 10"/>
    <circle cx="730" cy="160" r="124" fill="none" stroke="#00f0ff" stroke-opacity="0.28" stroke-width="1"/>

    <g>
      <circle cx="782" cy="160" r="4" fill="#00f0ff"/>
      <animateTransform attributeName="transform" type="rotate" values="0 730 160;360 730 160" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="642" cy="160" r="5" fill="#a855f7"/>
      <circle cx="642" cy="160" r="9" fill="none" stroke="#a855f7" stroke-opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" values="360 730 160;0 730 160" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="730" cy="36" r="3" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="rotate" values="0 730 160;360 730 160" dur="20s" repeatCount="indefinite"/>
    </g>

    <circle cx="730" cy="160" r="26" fill="url(#core)">
      <animate attributeName="r" values="22;30;22" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="160" r="5" fill="#ffffff"/>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="900" height="2" fill="#00f0ff" opacity="0.18">
    <animate attributeName="y" values="-4;320" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corners -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.85">
    <path d="M20 44V20H44"/>
    <path d="M880 44V20H856"/>
    <path d="M20 276V300H44"/>
    <path d="M880 276V300H856"/>
  </g>

  <!-- status line -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2">
    <text x="60" y="62" fill="#5b6b94">SYS://ANUP.GK</text>
    <circle cx="205" cy="58" r="4" fill="#39ff88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="216" y="62" fill="#39ff88">ONLINE</text>
  </g>

  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
    <!-- greeting -->
    <text x="60" y="118" font-size="14" letter-spacing="5" fill="#00f0ff">// HELLO, WORLD</text>

    <!-- glitch layers -->
    <text x="60" y="176" font-size="44" font-weight="700" fill="#00f0ff" opacity="0">
      ANUP GOWDA K T
      <animate attributeName="x" values="60;66;54;60;60;60;60;60;60;60" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0;0;0;0;0;0;0" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="176" font-size="44" font-weight="700" fill="#ff2bd6" opacity="0">
      ANUP GOWDA K T
      <animate attributeName="x" values="60;54;66;60;60;60;60;60;60;60" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0;0;0;0;0;0;0" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <!-- main name -->
    <text x="60" y="176" font-size="44" font-weight="700" fill="#ffffff">ANUP GOWDA K T</text>

    <!-- role -->
    <text x="62" y="212" font-size="19" letter-spacing="9" fill="url(#neon)">SOFTWARE ENGINEER</text>

    <!-- typed tagline -->
    <g clip-path="url(#typeclip)">
      <text x="60" y="250" font-size="15" fill="#8b98b8">&gt; building things that feel like tomorrow</text>
    </g>
    <rect x="60" y="236" width="9" height="18" fill="#00f0ff">
      <animate attributeName="x" values="60;432;432;60" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom energy line -->
  <rect x="0" y="316" width="900" height="4" fill="url(#neon)" opacity="0.9"/>
  <rect x="0" y="316" width="140" height="4" fill="#ffffff" opacity="0.7">
    <animate attributeName="x" values="-140;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
