name: Generate Snake

on:
  # refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # run manually from the Actions tab
  workflow_dispatch:
  # refresh whenever the profile is updated
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00f0ff&color_dots=#161b22,#0b3d4a,#0a6a7d,#00a7c4,#00f0ff&color_border=#0d1117
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#d8c8fb,#b794f6,#8b5cf6,#6d28d9&color_border=#ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
